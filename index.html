<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LS전선 | OpenDART 재무 대시보드</title><style>
:root{--ink:#10213b;--blue:#1455a2;--sky:#eaf3ff;--line:#dce5f0;--muted:#65748a}*{box-sizing:border-box}body{margin:0;background:#f6f8fc;color:var(--ink);font-family:Arial,'Malgun Gothic',sans-serif}.wrap{max-width:1240px;margin:auto;padding:32px 22px 56px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:1px solid var(--line);padding-bottom:24px}header img{width:130px;height:auto}.eyebrow{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.12em}.subtitle{color:var(--muted);margin:7px 0 0}.status{font-size:13px;color:var(--muted)}h1{margin:5px 0;font-size:30px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:25px 0}.card,.panel{background:white;border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 18px #10213b08}.card{padding:18px}.card .label{font-size:13px;color:var(--muted)}.card strong{display:block;margin-top:9px;font-size:23px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}.panel{padding:20px}.panel h2{font-size:16px;margin:0 0 15px}canvas{width:100%;height:245px;background:linear-gradient(#fff,#f8fbff);border-radius:8px}.legend{font-size:12px;color:var(--muted);line-height:1.8}.tables{margin-top:22px}.tabs{display:flex;gap:7px;margin:12px 0}.tabs button{border:1px solid var(--line);background:white;border-radius:7px;padding:8px 12px;color:var(--ink);cursor:pointer}.tabs button.active{background:var(--blue);border-color:var(--blue);color:white}table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;overflow:hidden}th{background:#eff5fd;text-align:right;padding:12px 10px;border-bottom:1px solid var(--line);white-space:nowrap}td{text-align:right;padding:11px 10px;border-bottom:1px solid #edf1f6;white-space:nowrap}th:first-child,td:first-child{text-align:left;font-weight:600}.note{color:var(--muted);font-size:12px;margin-top:15px}@media(max-width:800px){.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}header{align-items:flex-start}.wrap{padding:22px 14px}h1{font-size:24px}.table-wrap{overflow:auto}}
</style></head><body><main class="wrap"><header><div><div class="eyebrow">OPEN DART • FINANCIAL INTELLIGENCE</div><h1>LS전선 재무 대시보드</h1><p class="subtitle">사업·반기·분기 보고서 기반 핵심 수치와 재무비율</p></div><div><img src="assets/ls-cable-badge.svg" alt="LS전선"><div class="status" id="updated">데이터 불러오는 중</div></div></header><section class="kpis" id="kpis"></section><section class="grid"><div class="panel"><h2>매출액 · 영업이익 추이</h2><canvas id="trend" width="760" height="245"></canvas></div><div class="panel"><h2>최근 Annual 수익성</h2><canvas id="margin" width="340" height="245"></canvas><div class="legend">매출총이익률 · 영업이익률 · 순이익률</div></div></section><section class="tables panel"><h2>상세 재무 데이터</h2><div class="tabs"><button class="active" data-cat="annual">Annual</button><button data-cat="half_year">Half-year</button><button data-cat="quarterly">Quarterly</button></div><div class="table-wrap"><table><thead id="head"></thead><tbody id="body"></tbody></table></div><p class="note">단위: 원(비율은 %). 분기/반기는 누적 공시 기준일 수 있습니다. OpenDART 공시 원문을 기반으로 하며 투자 권유 목적이 아닙니다.</p></section></main><script>
const fmt=n=>n==null?'—':Math.abs(n)>=1e12?(n/1e12).toFixed(1)+'조':Math.abs(n)>=1e8?(n/1e8).toFixed(0)+'억':Number(n).toLocaleString('ko-KR');
const cols=[['period','기간'],['revenue','매출액'],['operating_income','영업이익'],['net_income','당기순이익'],['total_assets','자산총계'],['total_liabilities','부채총계'],['total_equity','자본총계'],['operating_cash_flow','영업현금흐름'],['free_cash_flow','잉여현금흐름'],['operating_margin_pct','영업이익률'],['roe_pct','ROE'],['current_ratio_pct','유동비율'],['debt_to_equity_pct','부채비율']];let data=[];
function latest(cat='annual'){return data.filter(x=>x.category===cat).at(-1)||{}}
function cards(){const r=latest();let values=[['최근 Annual 매출액',fmt(r.revenue)],['영업이익',fmt(r.operating_income)],['영업이익률',r.operating_margin_pct==null?'—':r.operating_margin_pct+'%'],['부채비율',r.debt_to_equity_pct==null?'—':r.debt_to_equity_pct+'%']];document.querySelector('#kpis').innerHTML=values.map(x=>`<div class="card"><span class="label">${x[0]}</span><strong>${x[1]}</strong></div>`).join('')}
function graph(id, series, colors){let c=document.getElementById(id),x=c.getContext('2d'),w=c.width,h=c.height;x.clearRect(0,0,w,h);let all=series.flatMap(s=>s.values).filter(v=>v!=null),max=Math.max(...all.map(Math.abs),1);x.strokeStyle='#dce5f0';for(let y=30;y<h;y+=45){x.beginPath();x.moveTo(35,y);x.lineTo(w-10,y);x.stroke()}series.forEach((s,j)=>{x.strokeStyle=colors[j];x.lineWidth=3;x.beginPath();s.values.forEach((v,i)=>{let px=45+i*(w-70)/Math.max(s.values.length-1,1),py=h-25-(v||0)/max*(h-55);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()});}
function draw(){let annual=data.filter(x=>x.category==='annual');graph('trend',[{values:annual.map(x=>x.revenue)},{values:annual.map(x=>x.operating_income)}],['#1455a2','#18a37b']);let r=latest(),vals=[r.gross_margin_pct||0,r.operating_margin_pct||0,r.net_margin_pct||0],c=document.getElementById('margin'),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);vals.forEach((v,i)=>{x.fillStyle=['#1455a2','#18a37b','#f29f3d'][i];x.fillRect(30+i*95,220-v*3,52,v*3);x.fillStyle='#10213b';x.fillText(v.toFixed(1)+'%',25+i*95,235)})}
function table(cat){let rows=data.filter(x=>x.category===cat).slice().reverse();document.querySelector('#head').innerHTML='<tr>'+cols.map(c=>'<th>'+c[1]+'</th>').join('')+'</tr>';document.querySelector('#body').innerHTML=rows.length?rows.map(r=>'<tr>'+cols.map(([k])=>'<td>'+((k.endsWith('_pct'))?(r[k]==null?'—':r[k]+'%'):(k==='period'?r[k]:fmt(r[k])))+'</td>').join('')+'</tr>').join(''):'<tr><td colspan="13">아직 수집된 데이터가 없습니다. GitHub Actions를 실행해 주세요.</td></tr>'}
fetch('data/dashboard.json').then(r=>r.json()).then(d=>{data=d.records||[];document.querySelector('#updated').textContent='최종 갱신: '+(d.updated_at||'—');cards();draw();table('annual')}).catch(()=>{document.querySelector('#updated').textContent='데이터 준비 전';table('annual')});document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');table(b.dataset.cat)});
</script></body></html>
